name: Build & Release Kapra Silai Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kapra-Silai-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.${{ github.run_number }}
          name: "Kapra Silai Android APK (Build #${{ github.run_number }})"
          body: "Direct installable Android APK for Kapra Silai (StitchTech). Tap **app-debug.apk** below on your Android phone to install!"
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
