name: Build & Release Kapra Silai Android APK v3.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Persistent Signing Keystore (Prevents Update Package Conflict)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          cp -f ~/.android/debug.keystore android-app/app/debug.keystore

      - name: Populate & Verify Android WebView Assets (Prevents ERR_FILE_NOT_FOUND)
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -f index.html android-app/app/src/main/assets/kapra_silai_app.html
          cp -f index.html android-app/app/src/main/assets/index.html
          ls -lh android-app/app/src/main/assets/
          test -s android-app/app/src/main/assets/kapra_silai_app.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Verify HTML Asset Is Packaged Inside APK
        run: |
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep "assets/kapra_silai_app.html"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/Kapra-Silai-v3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kapra-Silai-Android-APK-v3.0
          path: android-app/app/build/outputs/apk/debug/Kapra-Silai-v3.0.apk

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "Kapra Silai Android APK v3.0 (Build #${{ github.run_number }} — No Conflict + Verified Assets)"
          body: |
            ### ✅ Kapra Silai v3.0 Android APK (Build #${{ github.run_number }})
            - **Zero Package Conflict**: Uses clean package ID `com.stitchtech.kaprasilai.v3` + persistent RSA-2048 signing keystore so it installs alongside or over old builds without conflict!
            - **Zero File Not Found**: Verified `assets/kapra_silai_app.html` inside APK and served via `shouldInterceptRequest` HTTPS stream (`https://appassets.kaprasilai.pk/index.html`).
            - **100% Data Availability**: Pre-seeded Multan/Rawalpindi/Lahore tailors, AI Naap calculator, 3D Studio, and live order tracker.
            - Tap **Kapra-Silai-v3.0.apk** below on your Android phone to install!
          files: |
            android-app/app/build/outputs/apk/debug/Kapra-Silai-v3.0.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
