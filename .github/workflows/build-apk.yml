name: Build & Release Kapra Silai Android APK v2.8

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Populate & Verify Android WebView Assets (Prevents ERR_FILE_NOT_FOUND)
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -f index.html android-app/app/src/main/assets/kapra_silai_app.html
          cp -f index.html android-app/app/src/main/assets/index.html
          ls -lh android-app/app/src/main/assets/
          test -s android-app/app/src/main/assets/kapra_silai_app.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK to Kapra-Silai-v2.8.apk
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/Kapra-Silai-v2.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kapra-Silai-Android-APK-v2.8
          path: android-app/app/build/outputs/apk/debug/Kapra-Silai-v2.8.apk

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.${{ github.run_number }}
          name: "Kapra Silai Android APK v2.8 (Build #${{ github.run_number }} — Fixed)"
          body: |
            ### ✅ Fixed Android APK (v2.8 Build #${{ github.run_number }})
            - **Fixed `ERR_FILE_NOT_FOUND`**: Bundles `kapra_silai_app.html` and `index.html` directly inside APK `assets/` and loads via `loadDataWithBaseURL()`.
            - Tap **Kapra-Silai-v2.8.apk** (or **app-debug.apk**) below on your Android phone to install!
          files: |
            android-app/app/build/outputs/apk/debug/Kapra-Silai-v2.8.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
